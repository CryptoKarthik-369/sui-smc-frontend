<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT ARISE — AI Crypto Trading Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#0a0f0d; --panel:#101a17; --panel-2:#0d1815; --border:#1e2c28;
    --mint:#6EE7B7; --mint-dim:#2f5c4c; --coral:#FF8A73; --azure:#6FB7FF; --amber:#F5C56B;
    --text:#E7F0EC; --text-dim:#86988f; --text-faint:#4d5e57;
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:radial-gradient(1400px 700px at 85% -10%, #10241d 0%, var(--bg) 55%); color:var(--text); font-family:var(--font-body); min-height:100vh;}
  ::-webkit-scrollbar{width:8px; height:8px;} ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
  button{font-family:inherit; cursor:pointer;}
  input, select{font-family:inherit;}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{width:100%; max-width:400px; background:linear-gradient(180deg,var(--panel),var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:36px 32px;}
  .login-brand{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .login-brand .dot{width:9px; height:9px; border-radius:50%; background:var(--mint); box-shadow:0 0 12px var(--mint);}
  .login-brand h1{font-family:var(--font-display); font-size:19px; font-weight:600;}
  .login-sub{color:var(--text-dim); font-size:12.5px; margin-bottom:28px; font-family:var(--font-mono);}
  .lfield{margin-bottom:16px;}
  .lfield label{display:block; font-family:var(--font-mono); font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px; margin-bottom:7px;}
  .lfield input{width:100%; background:#0b1512; border:1px solid var(--border); border-radius:9px; padding:11px 13px; color:var(--text); font-size:13.5px; outline:none; transition:border-color .15s;}
  .lfield input:focus{border-color:var(--mint-dim);}
  .lrow{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
  .remember{display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim);}
  .remember input{width:14px; height:14px; accent-color:var(--mint);}
  .forgot{font-family:var(--font-mono); font-size:11.5px; color:var(--azure); text-decoration:none;}
  .login-btn{width:100%; padding:13px; border-radius:9px; border:1px solid var(--mint-dim); background:linear-gradient(180deg,#163326,#0f241a); color:var(--mint); font-family:var(--font-display); font-weight:600; font-size:14px; transition:.15s;}
  .login-btn:hover{box-shadow:0 0 22px -6px var(--mint); border-color:var(--mint);}
  .login-foot{text-align:center; margin-top:20px; font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint);}

  /* ---------- Shell ---------- */
  .shell{display:flex; flex-direction:column; min-height:100vh;}
  nav{display:flex; align-items:center; justify-content:space-between; padding:14px 28px; border-bottom:1px solid var(--border); background:rgba(10,15,13,0.85); backdrop-filter:blur(10px); position:sticky; top:0; z-index:20;}
  .nav-left{display:flex; align-items:center; gap:28px;}
  .nav-brand{display:flex; align-items:center; gap:9px;}
  .nav-brand .dot{width:8px; height:8px; border-radius:50%; background:var(--mint); box-shadow:0 0 10px var(--mint);}
  .nav-brand span{font-family:var(--font-display); font-weight:600; font-size:15px;}
  .nav-tabs{display:flex; gap:4px;}
  .nav-tab{padding:8px 14px; border-radius:8px; font-family:var(--font-mono); font-size:12px; color:var(--text-dim); border:1px solid transparent; transition:.15s; background:none;}
  .nav-tab:hover{color:var(--text);}
  .nav-tab.active{color:var(--mint); background:#0f2119; border-color:var(--mint-dim);}
  .nav-right{display:flex; align-items:center; gap:14px;}
  .ai-status{display:flex; align-items:center; gap:7px; font-family:var(--font-mono); font-size:11px; color:var(--mint); border:1px solid var(--mint-dim); border-radius:999px; padding:5px 11px;}
  .ai-status .pulse{width:6px; height:6px; border-radius:50%; background:var(--mint); animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.3} 50%{opacity:1}}
  .avatar{width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--mint),var(--azure)); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:12px; color:#0a0f0d; cursor:pointer;}

  main{flex:1; padding:26px 28px 60px; max-width:1400px; margin:0 auto; width:100%;}

  /* ---------- shared cards ---------- */
  .grid{display:grid; gap:16px;}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel-2)); border:1px solid var(--border); border-radius:14px; padding:18px 20px;}
  .card-title{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px;}
  .card h3{font-family:var(--font-display); font-size:14px; font-weight:600; margin-bottom:12px;}

  /* ---------- Dashboard ---------- */
  .stat-grid{grid-template-columns:repeat(4,1fr); margin-bottom:16px;}
  .stat-val{font-family:var(--font-display); font-size:24px; font-weight:700;}
  .stat-val.mint{color:var(--mint);} .stat-val.coral{color:var(--coral);} .stat-val.azure{color:var(--azure);} .stat-val.amber{color:var(--amber);}
  .stat-delta{font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-top:4px;}
  .dash-mid{grid-template-columns:1.6fr 1fr; margin-bottom:16px;}
  .chart-wrap{height:200px; display:flex; align-items:flex-end; gap:3px; padding-top:10px;}
  .chart-bar{flex:1; background:linear-gradient(180deg,var(--mint),var(--mint-dim)); border-radius:3px 3px 0 0; opacity:.85;}
  .pos-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-family:var(--font-mono); font-size:12px;}
  .pos-row:last-child{border-bottom:none;}
  .side-tag{font-size:10px; padding:3px 8px; border-radius:5px; font-weight:600;}
  .side-tag.long{background:#0f2119; color:var(--mint);} .side-tag.short{background:#241210; color:var(--coral);}
  .dash-bottom{grid-template-columns:1fr 1fr;}
  .risk-bar{height:7px; border-radius:999px; background:#0b1512; border:1px solid var(--border); overflow:hidden; margin-top:8px;}
  .risk-fill{height:100%; background:linear-gradient(90deg,var(--mint),var(--amber));}
  .signal-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-family:var(--font-mono); font-size:11.5px;}
  .signal-row:last-child{border-bottom:none;}
  .sig-chip{font-size:9.5px; padding:3px 7px; border-radius:5px; background:#0f2119; color:var(--mint); border:1px solid var(--mint-dim);}

  /* ---------- Analysis ---------- */
  .an-layout{grid-template-columns:2.1fr 1fr; align-items:start;}
  .tv-chart{height:420px; border-radius:12px; background:linear-gradient(160deg,#0d1815,#0a1210); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; color:var(--text-faint); font-family:var(--font-mono); font-size:12px;}
  .tf-strip{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; align-items:stretch;}
  .tf-card{position:relative; border:1px solid var(--border); border-radius:12px; padding:14px 14px 12px; background:linear-gradient(165deg,#0d1815,#0a1210); overflow:hidden; transition:.18s; display:flex; flex-direction:column;}
  .tf-card::before{content:""; position:absolute; top:0; left:0; right:0; height:2px; background:var(--accent,var(--mint-dim));}
  .tf-card:hover{border-color:var(--accent,var(--mint-dim)); transform:translateY(-2px); box-shadow:0 10px 26px -14px rgba(0,0,0,0.6);}
  .tf-card.tf-1d{--accent:var(--azure);}
  .tf-card.tf-1h{--accent:var(--amber);}
  .tf-card.tf-5m{--accent:var(--mint);}
  .tf-head{display:flex; align-items:center; gap:9px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--border);}
  .tf-head .tf-icon{width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--accent,var(--mint)) 16%, transparent); border:1px solid var(--accent,var(--mint-dim)); color:var(--accent,var(--mint)); font-family:var(--font-display); font-size:10px; font-weight:700; flex-shrink:0;}
  .tf-head .tf-names{flex:1; min-width:0;}
  .tf-head .tf-name{display:block; font-family:var(--font-display); font-size:13px; font-weight:700; letter-spacing:.2px;}
  .tf-head .tf-role{display:block; font-family:var(--font-mono); font-size:9px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.5px; margin-top:1px;}
  .tf-head .tf-bias{align-self:flex-start; flex-shrink:0; font-family:var(--font-mono); font-size:9px; padding:3px 8px; border-radius:999px; white-space:nowrap;}
  .tf-head .tf-bias.bull{background:#0f2119; color:var(--mint); border:1px solid var(--mint-dim);}
  .tf-head .tf-bias.bear{background:#241210; color:var(--coral); border:1px solid #4a2a22;}
  .tf-body{flex:1; display:flex; flex-direction:column; gap:1px;}
  .tf-detail{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:6px 0; font-family:var(--font-mono); font-size:10.5px; border-bottom:1px dashed var(--border);}
  .tf-detail:last-child{border-bottom:none;}
  .tf-detail .k{color:var(--text-faint); text-transform:uppercase; letter-spacing:.5px; font-size:9px; padding-top:1px; flex-shrink:0;}
  .tf-detail .v{color:var(--text-dim); text-align:right; max-width:62%; line-height:1.45;}
  .tf-detail .v.mint{color:var(--mint);} .tf-detail .v.coral{color:var(--coral);} .tf-detail .v.azure{color:var(--azure);} .tf-detail .v.amber{color:var(--amber);}
  .tf-val.bull{color:var(--mint);} .tf-val.bear{color:var(--coral);}
  .verdict-box{text-align:center; padding:20px 0 16px;}
  .verdict-big{font-family:var(--font-display); font-size:30px; font-weight:700; color:var(--mint);}
  .conf-tag{display:inline-block; margin-top:8px; font-family:var(--font-mono); font-size:11px; color:var(--text-dim); border:1px solid var(--border); border-radius:999px; padding:4px 11px;}
  .lvl-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:14px 0;}
  .lvl{text-align:center; border:1px solid var(--border); border-radius:9px; padding:9px; background:#0b1512;}
  .lvl label{display:block; font-family:var(--font-mono); font-size:9px; color:var(--text-faint); margin-bottom:5px; text-transform:uppercase;}
  .lvl .v{font-family:var(--font-mono); font-size:12.5px;}
  .lvl.entry .v{color:var(--azure);} .lvl.sl .v{color:var(--coral);} .lvl.tp .v{color:var(--mint);}
  .rr-line{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); padding:8px 0; border-top:1px solid var(--border); margin-top:6px;}
  .ai-score-block{margin-top:14px;}
  .ai-score-head{display:flex; justify-content:space-between; align-items:baseline; font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-bottom:6px;}
  .ai-score-head .num{font-family:var(--font-display); font-size:15px; font-weight:700; color:var(--mint);}
  .ai-score-bar{height:8px; border-radius:999px; background:#0b1512; border:1px solid var(--border); overflow:hidden;}
  .ai-score-fill{height:100%; background:linear-gradient(90deg,var(--azure),var(--mint));}
  .ai-confirm{display:flex; align-items:center; gap:9px; margin-top:14px; padding:11px 13px; border-radius:10px; font-family:var(--font-mono); font-size:11.5px;}
  .ai-confirm .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .ai-confirm.go{background:#0f2119; border:1px solid var(--mint-dim); color:var(--mint);}
  .ai-confirm.go .dot{background:var(--mint); box-shadow:0 0 8px var(--mint);}
  .ai-confirm.wait{background:#181c14; border:1px solid #4a3d1e; color:var(--amber);}
  .ai-confirm.wait .dot{background:var(--amber);}
  .ai-confirm.blocked{background:#241210; border:1px solid #4a2a22; color:var(--coral);}
  .ai-confirm.blocked .dot{background:var(--coral);}
  .smc-list{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .smc-item{display:flex; align-items:center; justify-content:space-between; font-family:var(--font-mono); font-size:11.5px; padding:8px 10px; background:#0b1512; border:1px solid var(--border); border-radius:8px;}
  .smc-dot{width:7px; height:7px; border-radius:50%; margin-right:8px; display:inline-block;}
  .zone-bar{height:60px; border-radius:9px; overflow:hidden; display:flex; flex-direction:column; margin-top:10px; border:1px solid var(--border);}
  .zone{flex:1; display:flex; align-items:center; padding-left:10px; font-family:var(--font-mono); font-size:10px;}
  .zone.premium{background:#241210; color:var(--coral);}
  .zone.eq{background:#181c14; color:var(--amber); border-top:1px solid var(--border); border-bottom:1px solid var(--border);}
  .zone.discount{background:#0f2119; color:var(--mint);}

  /* ---------- Journal ---------- */
  .j-filters{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .j-filters select, .j-filters input{background:#0b1512; border:1px solid var(--border); border-radius:8px; padding:9px 12px; color:var(--text); font-family:var(--font-mono); font-size:12px; outline:none;}
  .j-stats{grid-template-columns:repeat(4,1fr); margin-bottom:16px;}
  table{width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:12px;}
  th{text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-faint); padding:10px 12px; border-bottom:1px solid var(--border);}
  td{padding:11px 12px; border-bottom:1px solid var(--border); color:var(--text-dim);}
  tr:last-child td{border-bottom:none;}
  .pnl-pos{color:var(--mint);} .pnl-neg{color:var(--coral);}
  .ai-badge{font-size:10px; padding:3px 8px; border-radius:5px;}
  .ai-badge.approve{background:#0f2119; color:var(--mint); border:1px solid var(--mint-dim);}
  .ai-badge.reject{background:#241210; color:var(--coral); border:1px solid #4a2a22;}

  .placeholder-page{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; color:var(--text-faint); font-family:var(--font-mono); font-size:13px; text-align:center; gap:8px;}
  .placeholder-page h2{font-family:var(--font-display); color:var(--text-dim); font-size:16px;}

  /* ---------- Settings / Profile ---------- */
  .settings-layout{grid-template-columns:1fr 1fr; align-items:start;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-family:var(--font-mono); font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px; margin-bottom:7px;}
  .field input, .field select{width:100%; background:#0b1512; border:1px solid var(--border); border-radius:9px; padding:10px 12px; color:var(--text); font-size:13px; outline:none; font-family:var(--font-mono); transition:border-color .15s;}
  .field input:focus, .field select:focus{border-color:var(--mint-dim);}
  .field-hint{font-family:var(--font-mono); font-size:10px; color:var(--text-faint); margin-top:6px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .btn{padding:11px 18px; border-radius:9px; border:1px solid var(--mint-dim); background:linear-gradient(180deg,#163326,#0f241a); color:var(--mint); font-family:var(--font-display); font-weight:600; font-size:12.5px; transition:.15s;}
  .btn:hover{box-shadow:0 0 18px -6px var(--mint); border-color:var(--mint);}
  .btn.ghost{background:none; color:var(--text-dim); border-color:var(--border);}
  .btn.ghost:hover{color:var(--text); border-color:var(--text-dim); box-shadow:none;}
  .btn.danger{border-color:#4a2a22; color:var(--coral); background:linear-gradient(180deg,#2a1512,#1a0d0b);}
  .btn-row{display:flex; gap:10px; margin-top:6px;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .t-label{font-family:var(--font-body); font-size:13px; font-weight:500;}
  .toggle-row .t-sub{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin-top:3px;}
  .switch{position:relative; width:42px; height:24px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .slider{position:absolute; inset:0; background:#1c2822; border:1px solid var(--border); border-radius:999px; transition:.2s; cursor:pointer;}
  .switch .slider::before{content:""; position:absolute; width:16px; height:16px; left:3px; top:2.5px; background:var(--text-faint); border-radius:50%; transition:.2s;}
  .switch input:checked + .slider{background:#0f2119; border-color:var(--mint-dim);}
  .switch input:checked + .slider::before{transform:translateX(18px); background:var(--mint); box-shadow:0 0 8px var(--mint);}
  .coin-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; margin-top:10px; max-height:280px; overflow-y:auto; padding-right:4px;}
  .coin-search{position:relative; margin-top:12px;}
  .coin-search input{width:100%; background:#0b1512; border:1px solid var(--border); border-radius:9px; padding:9px 12px; color:var(--text); font-family:var(--font-mono); font-size:12px; outline:none;}
  .coin-meta{display:flex; align-items:center; justify-content:space-between; margin-top:8px; font-family:var(--font-mono); font-size:10px; color:var(--text-faint);}
  .coin-meta .refresh-btn{color:var(--azure); cursor:pointer; background:none; border:none; font-family:var(--font-mono); font-size:10px;}
  .coin-empty{grid-column:1/-1; text-align:center; padding:16px; color:var(--text-faint); font-family:var(--font-mono); font-size:11px;}
  .coin-chip{display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:9px; padding:9px 11px; background:#0b1512; cursor:pointer; transition:.15s; font-family:var(--font-mono); font-size:11.5px;}
  .coin-chip:hover{border-color:var(--mint-dim);}
  .coin-chip.on{border-color:var(--mint-dim); background:#0f2119; color:var(--mint);}
  .coin-chip input{accent-color:var(--mint); width:13px; height:13px;}
  .conn-status{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10.5px; padding:4px 10px; border-radius:999px;}
  .conn-status.ok{color:var(--mint); border:1px solid var(--mint-dim); background:#0f2119;}
  .conn-status.off{color:var(--text-faint); border:1px solid var(--border);}
  .conn-status .d{width:6px; height:6px; border-radius:50%; background:currentColor;}
  .profile-hero{display:flex; align-items:center; gap:16px; padding-bottom:18px; border-bottom:1px solid var(--border); margin-bottom:16px;}
  .profile-avatar{width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,var(--mint),var(--azure)); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:18px; color:#0a0f0d;}
  .profile-name{font-family:var(--font-display); font-size:16px; font-weight:600;}
  .profile-email{font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .plan-badge{margin-left:auto; font-family:var(--font-mono); font-size:10.5px; color:var(--amber); border:1px solid #4a3d1e; background:#1c1710; padding:5px 11px; border-radius:999px;}
  .save-toast{position:fixed; bottom:22px; right:22px; background:linear-gradient(180deg,#163326,#0f241a); border:1px solid var(--mint-dim); color:var(--mint); font-family:var(--font-mono); font-size:12px; padding:11px 16px; border-radius:10px; z-index:50; box-shadow:0 8px 30px -6px rgba(0,0,0,0.5);}

  @media (max-width: 900px){ .settings-layout{grid-template-columns:1fr;} }

  @media (max-width: 900px){
    .stat-grid, .dash-mid, .dash-bottom, .an-layout, .j-stats, .tf-strip{grid-template-columns:1fr;}
    .nav-tabs{display:none;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">

// ---------------- Dashboard ----------------
function Dashboard({ settings }) {
  const [activeCoin, setActiveCoin] = useState(settings.coins[0] || "SUIUSDT");
  useEffect(()=>{ if (!settings.coins.includes(activeCoin)) setActiveCoin(settings.coins[0]); }, [settings.coins]);

  const [live, setLive] = useState(null); // { balance, trades, stats, equityCurve, scan }
  const [loading, setLoading] = useState(false);
  const [fetchError, setFetchError] = useState("");

  const loadLive = () => {
    const base = (settings.serverUrl || "").trim().replace(/\/+$/, "");
    if (!base || !settings.connected) return;
    setLoading(true);
    setFetchError("");
    Promise.all([
      fetch(base + "/balance").then(r=>r.json()),
      fetch(base + "/trades?limit=50").then(r=>r.json()),
      fetch(base + "/equity").then(r=>r.json()),
      fetch(base + "/scan").then(r=>r.json()).catch(()=>null),
    ])
      .then(([balance, tradesRes, equityRes, scanRes]) => {
        setLive({ balance, trades: tradesRes.trades || [], stats: tradesRes.stats, equityCurve: equityRes.curve || [], scan: scanRes });
        setLoading(false);
      })
      .catch(err => {
        setFetchError(err.message || "Could not reach server");
        setLoading(false);
      });
  };

  useEffect(() => { loadLive(); }, [settings.connected, settings.serverUrl]);
  useEffect(() => {
    if (!settings.connected) return;
    const id = setInterval(loadLive, 30000); // refresh every 30s while viewing
    return () => clearInterval(id);
  }, [settings.connected, settings.serverUrl]);

  const usingLive = settings.connected && live !== null;
  const openTrades = usingLive ? live.trades.filter(t=>t.status==="open") : openPositions.map(p=>({symbol:p.symbol, side:p.side, entry:p.price, price:p.price, pnl:p.pnl}));
  const balance = usingLive ? live.balance.currentBalanceUsdt : 12480.32;
  const startBalance = usingLive ? live.balance.startingBalanceUsdt : 12106;
  const balanceDeltaPct = usingLive && startBalance ? (((balance-startBalance)/startBalance)*100).toFixed(2) : "3.1";
  const winRate = usingLive ? live.stats.winRate : 68.4;
  const closedCount = usingLive ? live.stats.closedTrades : 30;
  const dailyPnl = usingLive ? live.balance.closedPnlUsdt : 284.10;
  const barsData = usingLive
    ? (live.equityCurve.length ? live.equityCurve.map(e=>e.cumulativePct) : [0])
    : equityData;
  const barsMax = Math.max(...barsData.map(v=>Math.abs(v)), 1);

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"14px"}}>
        <span className={"conn-status "+(usingLive ? "ok" : "off")}>
          <span className="d"></span>{usingLive ? "LIVE — from your backend" : "DEMO DATA — connect a server in Settings for real numbers"}
        </span>
        <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
          {settings.connected && <button className="refresh-btn" onClick={loadLive} disabled={loading}>{loading?"refreshing…":"refresh"}</button>}
          <select value={activeCoin} onChange={e=>setActiveCoin(e.target.value)} style={{background:"#0b1512",border:"1px solid var(--border)",borderRadius:"8px",padding:"7px 11px",color:"var(--text)",fontFamily:"var(--font-mono)",fontSize:"12px"}}>
            {settings.coins.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      </div>
      {fetchError && <div className="field-hint" style={{color:"var(--coral)",marginBottom:"12px"}}>⚠ {fetchError} — showing demo data below.</div>}

      <div className="grid stat-grid">
        <div className="card"><div className="card-title">Account Balance</div><div className="stat-val mint">${balance.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div className="stat-delta">{balanceDeltaPct>=0?"+":""}{balanceDeltaPct}% overall</div></div>
        <div className="card"><div className="card-title">Closed PnL</div><div className="stat-val azure">{dailyPnl>=0?"+":""}${Math.abs(dailyPnl).toFixed(2)}</div><div className="stat-delta">cumulative</div></div>
        <div className="card"><div className="card-title">Open Positions</div><div className="stat-val amber">{openTrades.length}</div><div className="stat-delta">{openTrades.filter(t=>t.side==="BUY"||t.side==="LONG").length} long · {openTrades.filter(t=>t.side==="SELL"||t.side==="SHORT").length} short</div></div>
        <div className="card"><div className="card-title">Win Rate</div><div className="stat-val mint">{winRate}%</div><div className="stat-delta">last {closedCount} closed</div></div>
      </div>

      <div className="grid dash-mid">
        <div className="card">
          <h3>Performance</h3>
          <div className="chart-wrap">
            {barsData.map((v,i)=>(<div key={i} className="chart-bar" style={{height:(Math.abs(v)/barsMax*100)+"%", background: v<0 ? "linear-gradient(180deg,var(--coral),#5c2f2f)" : undefined}}></div>))}
          </div>
        </div>
        <div className="card">
          <h3>Open Positions</h3>
          {openTrades.length === 0 && <div style={{fontFamily:"var(--font-mono)",fontSize:"11.5px",color:"var(--text-faint)",padding:"10px 0"}}>No open positions</div>}
          {openTrades.map((p,i)=>(
            <div className="pos-row" key={i}>
              <span><span className={"side-tag "+(p.side||"").toLowerCase()}>{p.side}</span> {p.symbol}</span>
              <span>{p.entry ?? p.price ?? "—"}</span>
              <span style={{color:"var(--mint)"}}>{p.pnl ?? "—"}</span>

      <div className="grid dash-bottom">

          <h3>Risk Monitor</h3>
          <div style={{fontFamily:"var(--font-mono)",fontSize:"11.5px",color:"var(--text-dim)"}}>Account risk exposure</div>

          <div style={{fontFamily:"var(--font-mono)",fontSize:"11px",color:"var(--text-faint)",marginTop:"6px"}}>{settings.riskPerTrade}% risk per trade · {settings.maxExposure}% max exposure{usingLive?` · $${live.balance.openNotionalUsdt} notional open`:""}</div>
        </div>
        <div className="card">
          <h3>Recent Signals</h3>
          {usingLive ? (
            (live.scan?.results || []).length === 0
              ? <div style={{fontFamily:"var(--font-mono)",fontSize:"11.5px",color:"var(--text-faint)",padding:"10px 0"}}>No scans yet</div>
              : live.scan.results.map((r,i)=>(
                <div className="signal-row" key={i}>
                  <span style={{color:"var(--text-faint)"}}>{r.symbol}</span>
                  <span style={{color:"var(--azure)"}}>{r.analysis?.side || "—"}</span>
                  {(r.analysis?.signals||[]).map(t=><span key={t} className="sig-chip">{t}</span>)}
                  <span style={{marginLeft:"auto",color:"var(--mint)"}}>{r.analysis?.confluenceScore ?? "—"}/5</span>

              ))
          ) : recentSignals.map((s,i)=>(
            <div className="signal-row" key={i}>
              <span style={{color:"var(--text-faint)"}}>{s.time}</span>
              <span style={{color:"var(--azure)"}}>{s.tf}</span>
              {s.tags.map(t=><span key={t} className="sig-chip">{t}</span>)}

      </div>
    </div>
  );
}

// ---------------- Analysis ----------------
function Analysis({ settings }) {

  const aiScore = 82; // out of 100 — model confidence blending confluence, structure, R:R

  if (settings.aiVeto && confluenceScore < minConfluence) {

// ---------------- Journal ----------------
function Journal({ settings }) {
  const [filterSymbol, setFilterSymbol] = useState("all");
  const [liveRows, setLiveRows] = useState(null); // null = not fetched / using mock
  const [loading, setLoading] = useState(false);
  const [fetchError, setFetchError] = useState("");

  const normalize = (t) => ({
    date: (t.time || "").slice(0,10) || "—",
    symbol: t.symbol || "—",
    side: (t.side || "—"),
    entry: t.entry ?? "—",
    exit: t.exit ?? (t.status === "open" ? "open" : "—"),
    pnl: t.pnlPct != null ? (t.pnlPct>0?"+":"") + t.pnlPct.toFixed(2) + "%" : (t.status === "rejected" ? "0.00%" : "—"),
    ai: t.status === "rejected" ? "reject" : "approve",
    note: t.reason || t.error || (t.signals && t.signals.length ? `${t.mode} · ${t.signals.join(", ")}` : t.mode || "—"),
  });

  const loadLiveTrades = () => {
    const base = (settings.serverUrl || "").trim().replace(/\/+$/, "");
    if (!base) { setFetchError("No server URL set in Settings"); return; }
    setLoading(true);
    setFetchError("");
    fetch(base + "/trades")
      .then(r => { if (!r.ok) throw new Error("Server responded with " + r.status); return r.json(); })
      .then(data => {
        setLiveRows((data.trades || []).map(normalize));
        setLoading(false);
      })
      .catch(err => {
        setFetchError(err.message || "Could not reach server");
        setLoading(false);
      });
  };

  useEffect(() => { if (settings.connected) loadLiveTrades(); }, [settings.connected, settings.serverUrl]);

  const usingLive = settings.connected && liveRows !== null;
  const source = usingLive ? liveRows : journalTrades;
  const wins = source.filter(t=>t.pnl.startsWith("+")).length;
  const rows = source.filter(t => filterSymbol==="all" || t.symbol===filterSymbol);

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"14px"}}>
        <span className={"conn-status "+(usingLive ? "ok" : "off")}>
          <span className="d"></span>{usingLive ? "LIVE — from your backend" : "DEMO DATA — connect a server in Settings for real trades"}
        </span>
        {settings.connected && (
          <button className="refresh-btn" onClick={loadLiveTrades} disabled={loading}>{loading ? "refreshing…" : "refresh"}</button>
        )}
      </div>
      {fetchError && <div className="field-hint" style={{color:"var(--coral)",marginBottom:"12px"}}>⚠ {fetchError} — showing demo data below.</div>}

      <div className="grid j-stats">
        <div className="card"><div className="card-title">Total Trades</div><div className="stat-val mint">{source.length}</div></div>
        <div className="card"><div className="card-title">Win Rate</div><div className="stat-val azure">{source.length ? Math.round(wins/source.length*100) : 0}%</div></div>
        <div className="card"><div className="card-title">Net PnL</div><div className="stat-val mint">{usingLive ? "—" : "+5.70%"}</div></div>
        <div className="card"><div className="card-title">AI Approved</div><div className="stat-val amber">{source.filter(t=>t.ai==="approve").length}/{source.length}</div></div>
      </div>

      <div className="card">
        <div className="j-filters">
          <select value={filterSymbol} onChange={e=>setFilterSymbol(e.target.value)}>
            <option value="all">All symbols</option>
            {[...new Set(source.map(t=>t.symbol))].map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          <input type="date" />
          <input type="date" />
        </div>
        <table>
          <thead>
            <tr><th>Date</th><th>Symbol</th><th>Side</th><th>Entry</th><th>Exit</th><th>PnL</th><th>AI Decision</th><th>Notes</th></tr>
          </thead>
          <tbody>
            {rows.length === 0 && (
              <tr><td colSpan="8" style={{textAlign:"center",color:"var(--text-faint)"}}>No trades yet</td></tr>
            )}
            {rows.map((t,i)=>(
              <tr key={i}>
                <td>{t.date}</td>
                <td>{t.symbol}</td>
                <td><span className={"side-tag "+t.side.toLowerCase()}>{t.side}</span></td>
                <td>{t.entry}</td>
                <td>{t.exit}</td>
                <td className={t.pnl.startsWith("+") ? "pnl-pos" : t.pnl.startsWith("-") ? "pnl-neg" : ""}>{t.pnl}</td>
                <td><span className={"ai-badge "+t.ai}>{t.ai}</span></td>
                <td style={{color:"var(--text-faint)"}}>{t.note}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ---------------- Settings ---------------- 
function Settings({ settings, setSettings, showToast }) {
  const [apiKey, setApiKey] = useState(settings.apiKey);
  const [apiSecret, setApiSecret] = useState(settings.apiSecret);
  const [showSecret, setShowSecret] = useState(false);
  const [testing, setTesting] = useState(false);
  const [connStatus, setConnStatus] = useState(settings.connected ? "ok" : "off");
  const [coinList, setCoinList] = useState(fallbackCoins);
  const [coinsLoading, setCoinsLoading] = useState(true);
  const [coinSource, setCoinSource] = useState("fallback list");
  const [coinSearch, setCoinSearch] = useState("");

  const loadCoins = () => {
    setCoinsLoading(true);
    fetch("https://fapi.binance.com/fapi/v1/exchangeInfo")
      .then(r => r.json())
      .then(data => {
        const pairs = (data.symbols || [])
          .filter(s => s.contractType === "PERPETUAL" && s.status === "TRADING" && s.quoteAsset === "USDT")
          .map(s => ({ symbol: s.symbol, name: s.baseAsset }))
          .sort((a,b) => a.symbol.localeCompare(b.symbol));
        if (pairs.length > 0) {
          setCoinList(pairs);
          setCoinSource("Binance Futures (live)");
        } else {
          setCoinList(fallbackCoins);
          setCoinSource("fallback list");
        }
      })
      .catch(() => {
        setCoinList(fallbackCoins);
        setCoinSource("fallback list — Binance unreachable");
      })
      .finally(() => setCoinsLoading(false));
  };

  useEffect(() => { loadCoins(); }, []);

  const filteredCoins = coinList.filter(c =>
    c.symbol.toLowerCase().includes(coinSearch.toLowerCase())
  );

  const toggleCoin = (sym) => {
    const has = settings.coins.includes(sym);
    const next = has ? settings.coins.filter(c=>c!==sym) : [...settings.coins, sym];
    if (next.length === 0) return; // keep at least one
    setSettings({ ...settings, coins: next });
  };

  const [serverUrl, setServerUrl] = useState(settings.serverUrl);
  const [serverInfo, setServerInfo] = useState(null);
  const [connError, setConnError] = useState("");

  const testConnection = () => {
    setTesting(true);
    setConnError("");
    const base = serverUrl.trim().replace(/\/+$/, "");
    if (!base) {
      setTesting(false);
      setConnStatus("off");
      showToast("Enter your server / webhook base URL first");
      return;
    }
    fetch(base + "/status")
      .then(r => {
        if (!r.ok) throw new Error("Server responded with " + r.status);
        return r.json();
      })
      .then(data => {
        setServerInfo(data);
        setConnStatus("ok");
        setTesting(false);
        showToast(`Connected — backend is in ${data.mode?.toUpperCase() || "?"} mode`);
      })
      .catch(err => {
        setConnStatus("off");
        setServerInfo(null);
        setConnError(err.message || "Could not reach server");
        setTesting(false);
        showToast("Connection failed — check the server URL and that it's deployed");
      });
  };

  const saveApi = () => {
    setSettings({ ...settings, apiKey, apiSecret, serverUrl, connected: connStatus==="ok" });
    showToast("Settings saved for this session");
  };

  // Push a toggle change straight to the backend so it actually takes effect
  // (not just local UI state). Reverts + shows an error if the call fails.
  const pushConfig = (patch) => {
    const base = (settings.serverUrl || "").trim().replace(/\/+$/, "");
    if (!base || !settings.connected) {
      // Not connected — just update local state, nothing to push to yet.
      const localPatch = {};
      if (patch.autoTrade !== undefined) localPatch.autoTrade = patch.autoTrade;
      if (patch.tradeEnabled !== undefined) localPatch.liveTrading = patch.tradeEnabled;
      setSettings({ ...settings, ...localPatch });
      return;
    }
    fetch(base + "/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(patch),
    })
      .then(r => { if (!r.ok) throw new Error("Server responded with " + r.status); return r.json(); })
      .then(data => {
        const cfg = data.config || {};
        setSettings({ ...settings, autoTrade: cfg.autoTrade, liveTrading: cfg.tradeEnabled });
        showToast(`Applied — Auto-Trade ${cfg.autoTrade ? "ON" : "OFF"}, ${cfg.tradeEnabled ? "LIVE" : "PAPER"} mode`);
      })
      .catch(err => {
        showToast("Failed to apply — " + (err.message || "could not reach server"));
      });
  };

  // On connect, pull the backend's actual current config so the toggles
  // reflect reality (in case it was changed elsewhere, or after a restart).
  useEffect(() => {
    const base = (settings.serverUrl || "").trim().replace(/\/+$/, "");
    if (!base || !settings.connected) return;
    fetch(base + "/config")
      .then(r => r.json())
      .then(data => {
        const cfg = data.config;
        if (!cfg) return;
        setSettings({ ...settings, autoTrade: cfg.autoTrade, liveTrading: cfg.tradeEnabled, minConfluence: String(cfg.minConfluence) });
      })
      .catch(() => {});
  }, [settings.connected]);

  return (
    <div className="grid settings-layout">
      <div>
        <div className="card">
          <h3>Exchange API Connection</h3>
          <div className="field-hint" style={{marginBottom:"14px"}}>
            Binance Futures keys — stored in this session only. Never share keys with anyone; use IP-restricted, futures-only keys with withdrawal permission disabled.
          </div>
          <div className="field">
            <label>Binance API Key</label>
            <input type="text" placeholder="e.g. AkQ7...9xLp" value={apiKey} onChange={e=>setApiKey(e.target.value)} />
          </div>
          <div className="field">
            <label>Binance Secret Key</label>
            <input type={showSecret?"text":"password"} placeholder="••••••••••••••••" value={apiSecret} onChange={e=>setApiSecret(e.target.value)} />
            <div className="field-hint"><label style={{display:"inline-flex",alignItems:"center",gap:"6px",cursor:"pointer",textTransform:"none",letterSpacing:0}}><input type="checkbox" checked={showSecret} onChange={e=>setShowSecret(e.target.checked)} style={{width:"12px",height:"12px"}}/> show secret</label></div>
          </div>
          <div className="field">
            <label>Backend Server URL</label>
            <input type="text" placeholder="https://sui-smc-backend.onrender.com" value={serverUrl} onChange={e=>setServerUrl(e.target.value)} />
            <div className="field-hint">Your self-contained scanner backend (no TradingView needed) — no trailing slash.</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:"6px",marginTop:"4px",marginBottom:"14px"}}>
            <span className={"conn-status "+(connStatus==="ok"?"ok":"off")} style={{width:"fit-content"}}>
              <span className="d"></span>
              {connStatus==="ok"
                ? `Connected — backend mode: ${serverInfo?.mode?.toUpperCase() || "?"}`
                : "Not connected"}
            </span>
            {connError && <span style={{fontFamily:"var(--font-mono)",fontSize:"10px",color:"var(--coral)"}}>⚠ {connError}</span>}
            {serverInfo && (
              <span style={{fontFamily:"var(--font-mono)",fontSize:"10px",color:"var(--text-faint)"}}>
                symbol: {serverInfo.defaultSymbol} · min confluence: {serverInfo.minConfluence} · uptime: {serverInfo.uptimeSeconds}s
              </span>
            )}
          </div>
          <div className="btn-row">
            <button className="btn ghost" onClick={testConnection} disabled={testing}>{testing ? "Testing…" : "Test Connection"}</button>
            <button className="btn" onClick={saveApi}>Save Settings</button>
          </div>
        </div>

        <div className="card" style={{marginTop:"16px"}}>
          <h3>Trading Mode</h3>
          {!settings.connected && (
            <div className="field-hint" style={{color:"var(--amber)",marginBottom:"10px"}}>
              ⚠ Not connected to a backend yet — these toggles will only be saved locally until you connect (above) and they can reach your server.
            </div>
          )}
          <div className="toggle-row">
            <div>
              <div className="t-label">Auto-Trade</div>
              <div className="t-sub">Let the scanner execute signals automatically without manual confirmation</div>
            </div>
            <label className="switch">
              <input type="checkbox" checked={settings.autoTrade} onChange={e=>pushConfig({ autoTrade: e.target.checked })} />
              <span className="slider"></span>
            </label>
          </div>
          <div className="toggle-row">
            <div>
              <div className="t-label">Live Trading</div>
              <div className="t-sub">Off = paper trading (simulated fills, no real orders sent)</div>
            </div>
            <label className="switch">
              <input type="checkbox" checked={settings.liveTrading} onChange={e=>pushConfig({ tradeEnabled: e.target.checked })} />
              <span className="slider"></span>
            </label>
          </div>
          <div className="toggle-row">
            <div>
              <div className="t-label">AI Trade Veto</div>
              <div className="t-sub">Block signals below minimum confluence score, even in auto-trade</div>
            </div>
            <label className="switch">
              <input type="checkbox" checked={settings.aiVeto} onChange={e=>setSettings({...settings, aiVeto:e.target.checked})} />
              <span className="slider"></span>
            </label>
          </div>
          {settings.autoTrade && settings.liveTrading && (
            <div className="field-hint" style={{color:"var(--coral)",marginTop:"10px"}}>
              ⚠ Auto-trade + live trading is enabled — the bot will place real orders on Binance Futures without confirmation.
            </div>
          )}
        </div>
      </div>

      <div>
        <div className="card">
          <h3>Coin Selection</h3>
          <div className="field-hint">Symbols pulled live from Binance USDT-M Futures. Select the ones the bot should scan and can trade — at least one required.</div>
          <div className="coin-search">
            <input type="text" placeholder="Search symbol (e.g. SOL, BTC)…" value={coinSearch} onChange={e=>setCoinSearch(e.target.value)} />
          </div>
          <div className="coin-meta">
            <span>{coinsLoading ? "Loading symbols from Binance…" : `${coinList.length} pairs · source: ${coinSource}`}</span>
            <button className="refresh-btn" onClick={loadCoins} disabled={coinsLoading}>{coinsLoading ? "…" : "refresh"}</button>
          </div>
          <div className="coin-grid">
            {filteredCoins.length === 0 && !coinsLoading && (
              <div className="coin-empty">No symbols match "{coinSearch}"</div>
            )}
            {filteredCoins.map(c => (
              <label key={c.symbol} className={"coin-chip"+(settings.coins.includes(c.symbol)?" on":"")}>
                <input type="checkbox" checked={settings.coins.includes(c.symbol)} onChange={()=>toggleCoin(c.symbol)} />
                {c.symbol}
              </label>
            ))}
          </div>
        </div>

        <div className="card" style={{marginTop:"16px"}}>
          <h3>Risk Management</h3>
          <div className="field-row">
            <div className="field">
              <label>Risk per trade (%)</label>
              <input type="number" step="0.1" min="0.1" max="10" value={settings.riskPerTrade} onChange={e=>setSettings({...settings, riskPerTrade:e.target.value})} />
            </div>
            <div className="field">
              <label>Max exposure (%)</label>
              <input type="number" step="1" min="1" max="100" value={settings.maxExposure} onChange={e=>setSettings({...settings, maxExposure:e.target.value})} />
            </div>
          </div>
          <div className="field-row">
            <div className="field">
              <label>Min confluence score</label>
              <select value={settings.minConfluence} onChange={e=>setSettings({...settings, minConfluence:e.target.value})}>
                {[1,2,3,4,5].map(n=><option key={n} value={n}>{n} / 5</option>)}
              </select>
            </div>
            <div className="field">
              <label>Default order type</label>
              <select value={settings.orderType} onChange={e=>setSettings({...settings, orderType:e.target.value})}>
                <option>MARKET</option>
                <option>LIMIT</option>
              </select>
            </div>
          </div>
          <button className="btn" style={{marginTop:"4px"}} onClick={()=>showToast("Risk settings saved")}>Save Risk Settings</button>
        </div>

        <div className="card" style={{marginTop:"16px"}}>
          <h3>Notifications</h3>
          <div className="toggle-row">
            <div><div className="t-label">Trade alerts</div><div className="t-sub">Notify on every filled entry / exit</div></div>
            <label className="switch"><input type="checkbox" checked={settings.notifyTrades} onChange={e=>setSettings({...settings, notifyTrades:e.target.checked})} /><span className="slider"></span></label>
          </div>
          <div className="toggle-row">
            <div><div className="t-label">Signal alerts</div><div className="t-sub">Notify on new SMC confluence signals</div></div>
            <label className="switch"><input type="checkbox" checked={settings.notifySignals} onChange={e=>setSettings({...settings, notifySignals:e.target.checked})} /><span className="slider"></span></label>
          </div>
        </div>
      </div>
    </div>
  );
}

// ---------------- Profile ----------------

  const [email, setEmail] = useState("karthik@example.com");
  const [timezone, setTimezone] = useState("Asia/Kolkata");

  return (
    <div className="grid settings-layout">
      <div>
        <div className="card">
          <div className="profile-hero">

            <div>
              <div className="profile-name">{name}</div>
              <div className="profile-email">{email}</div>
            </div>
            <div className="plan-badge">PRO · PHASE 1</div>

          <div className="field"><label>Current password</label><input type="password" placeholder="••••••••" /></div>
          <div className="field-row">
            <div className="field"><label>New password</label><input type="password" placeholder="••••••••" /></div>
            <div className="field"><label>Confirm new password</label><input type="password" placeholder="••••••••" /></div>
          </div>
          <button className="btn ghost" onClick={()=>showToast("Password updated")}>Update Password</button>
        </div>
      </div>

      <div>
        <div className="card">
          <h3>Account Summary</h3>
          <div className="toggle-row"><div className="t-label">Trading mode</div><div style={{fontFamily:"var(--font-mono)",fontSize:"11.5px",color:settings.liveTrading?"var(--coral)":"var(--mint)"}}>{settings.liveTrading?"LIVE":"PAPER"}</div></div>
          <div className="toggle-row"><div className="t-label">Auto-trade</div><div style={{fontFamily:"var(--font-mono)",fontSize:"11.5px",color:settings.autoTrade?"var(--mint)":"var(--text-faint)"}}>{settings.autoTrade?"ON":"OFF"}</div></div>
          <div className="toggle-row"><div className="t-label">Active coins</div><div style={{fontFamily:"var(--font-mono)",fontSize:"11.5px",color:"var(--azure)"}}>{settings.coins.length}</div></div>
          <div className="toggle-row"><div className="t-label">API connection</div><div style={{fontFamily:"var(--font-mono)",fontSize:"11.5px",color:settings.connected?"var(--mint)":"var(--text-faint)"}}>{settings.connected?"CONNECTED":"NOT CONNECTED"}</div></div>
        </div>
        <div className="card" style={{marginTop:"16px"}}>
          <h3>Danger Zone</h3>
          <div className="field-hint" style={{marginBottom:"12px"}}>Revoke API access and clear locally stored credentials from this browser session.</div>
          <button className="btn danger" onClick={()=>showToast("API credentials cleared")}>Revoke API Access</button>
        </div>
      </div>
    </div>
  );
}

// ---------------- App ----------------
function App() {
  const [loggedIn, setLoggedIn] = useState(() => localStorage.getItem("satarise_loggedIn") === "true");
  const [page, setPage] = useState("Dashboard");
  const [toast, setToast] = useState(null);
  const [settings, setSettingsRaw] = useState(() => {
    const saved = localStorage.getItem("satarise_settings");
    const defaults = {
      apiKey: "", apiSecret: "", serverUrl: "https://your-app.onrender.com",
      connected: false, autoTrade: false, liveTrading: false, aiVeto: true,
      coins: ["SUIUSDT"], riskPerTrade: "1.0", maxExposure: "10", minConfluence: "3",
      orderType: "MARKET", notifyTrades: true, notifySignals: true,
    };
    if (!saved) return defaults;
    try { return { ...defaults, ...JSON.parse(saved) }; } catch { return defaults; }
  });

  const setSettings = (next) => {
    setSettingsRaw(next);
    localStorage.setItem("satarise_settings", JSON.stringify(next));
  };

  const login = () => {
    localStorage.setItem("satarise_loggedIn", "true");
    setLoggedIn(true);
  };
  const logout = () => {
    localStorage.removeItem("satarise_loggedIn");
    setLoggedIn(false);
  };

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(()=>setToast(null), 2400);
  };

  if (!loggedIn) return <LoginPage onLogin={login} />;

  return (
    <div className="shell">
      <Nav page={page} setPage={setPage} onLogout={logout} settings={settings} />
      <main>
        {page === "Dashboard" && <Dashboard settings={settings} />}
        {page === "Analysis" && <Analysis settings={settings} />}
        {page === "Journal" && <Journal settings={settings} />}
        {page === "Settings" && <Settings settings={settings} setSettings={setSettings} showToast={showToast} />}
        {page === "Profile" && <Profile settings={settings} showToast={showToast} />}
      </main>
      {toast && <div className="save-toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
